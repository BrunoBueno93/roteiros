<style>
:root{--fundo:#0b1a2e;--painel:#14294a;--painel2:#1d3558;--texto:#f1e6cc;--suave:#a9b6c9;--ouro:#d8b46a;--laranja:#ff9a3d;--papel:#f4ecd8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.55 Arial,Helvetica,sans-serif;
 background-image:linear-gradient(rgba(216,180,106,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(216,180,106,.045) 1px,transparent 1px);background-size:32px 32px}
.w{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:28px 0 18px;border-bottom:1px solid rgba(216,180,106,.45);position:relative}

h1{font:normal 30px/1.2 Georgia,serif;margin:6px 0 8px;letter-spacing:.3px}
.como{color:var(--suave);font-size:15px;margin:0}
nav{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px}
nav h4{flex-basis:100%;margin:14px 0 2px;font:normal 14px Georgia,serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--ouro)}
nav a{flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(216,180,106,.5);border-radius:50%;color:var(--texto);text-decoration:none;font:15px Georgia,serif}
nav a.ok{background:var(--laranja);border-color:var(--laranja);color:var(--fundo);box-shadow:0 0 10px rgba(255,154,61,.6)}
h2.bloco{display:none;font:normal 15px Georgia,serif;letter-spacing:2px;text-transform:uppercase;color:var(--ouro);margin:34px 0 0;display:flex;align-items:center;gap:12px}

section.q{display:none;padding:14px 0 10px}

.perg{background:var(--painel);padding:14px;margin-top:10px;border:1px solid rgba(216,180,106,.3)}

.perg p{margin:0 0 10px}

.esp{margin-top:12px;padding:10px 12px;background:var(--painel2);border-left:3px solid var(--ouro)}

.auto{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}

.fim{margin-top:12px;padding:12px 14px;border:1px solid var(--laranja);color:#ffb469}
footer{padding:26px 0 40px;font:italic 14px Georgia,serif;color:var(--ouro);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

me:'';$('cur').style.left=(u*100)+'%';\n  P.forEach(function(x){x._b.className='mk'+(p===x?' on':(x.u<u+TOL?' ja':''));});\n  $('ico').setAttribute('d',rod?'M7 5h4v14H7zM13 5h4v14h-4z':'M8 5v14l11-7z');$('bi').setAttribute('aria-label',rod?'Pausar':'Iniciar');}\n function parar(){cancelAnimationFrame(raf);rod=false;alvo=null;espera=0;}\n /* play: o movimento segue no ritmo fisico e faz uma pausa curta em cada ponto de parada do meio do caminho */\n function passo(t){if(t0===null)t0=t;var dt=Math.min((t-t0)/1000,0.05);t0=t;\n  if(espera>0){espera-=dt;if(espera<=0){espera=0;d();}raf=requestAnimationFrame(passo);return;}\n  var un=Math.min(u+dt/o.dur,1),pp=P.filter(function(x){return x.u>u+1e-9&&x.u<=un+1e-9&&x.u<1-TOL;})[0];\n  if(pp){u=pp.u;espera=PAUSA;rod=false;d();rod=true;$('ico').setAttribute('d','M7 5h4v14H7zM13 5h4v14h-4z');raf=requestAnimationFrame(passo);return;}\n  u=un;if(u>=1){rod=false;d();return;}d();raf=requestAnimationFrame(passo);}\n /* setas e marcos: a cena viaja ate o ponto, em vez de saltar */\n function viagem(t){if(t0===null)t0=t;tv+=Math.min((t-t0)/1000,0.05);t0=t;var k=Math.min(tv/VIAGEM,1);u=u0+(alvo-u0)*k;\n  if(k>=1){u=alvo;alvo=null;d();return;}d();raf=requestAnimationFrame(viagem);}\n function ir(x){parar();if(Math.abs(x-u)<TOL){d();return;}if(x<u&&!o.voltaSuave){u=x;d();return;}\n  alvo=x;u0=u;tv=0;t0=null;raf=requestAnimationFrame(viagem);d();}\n $('bi').onclick=function(){if(rod){parar();}else{parar();if(u>=1)u=0;rod=true;t0=null;raf=requestAnimationFrame(passo);}d();};\n $('bp').onclick=function(){var n=P.filter(function(x){return x.u>u+TOL;})[0];if(n)ir(n.u);else{parar();u=P[0].u;d();}};\n $('ba').onclick=function(){var a=P.filter(function(x){return x.u<u-TOL;});parar();u=(a[a.length-1]||P[P.length-1]).u;d();};\n var R=o.rotulos||['Revelar dados ocultos','Esconder dados ocultos'],r1=R[0],r2=R[1];$('bv').textContent=r1;\n if(!o.rotulos&&o.temOculto===false)$('bv').style.display='none'; /* cena sem dado oculto: o botao nao teria o que  VM=Math.sqrt(Math.max(((P.ec0||0)+1)/(1+(P.ec0||0))-P.perda/(1+(P.ec0||0)),1e-9)); /* maior velocidade da cena (no fim), para a escala do vetor */\nvar repouso=!P.inicio||/v\\s*=\\s*0/.test(P.inicio); /* o enunciado diz que parte do repouso? */\nfunction desenhar(u,val,pt){\n g.innerHTML='';var e0=P.ec0||0,w=e0?(0.45*u+0.55*u*u):u*u,p=pos(w);\n el(g,'line',{x1:14,y1:YB+13,x2:250,y2:YB+13,stroke:'#f1e6cc','stroke-width':2});\n if(P.forma==='rampa'){var d='';for(var i=0;i<=40;i++){var q=pos(i/40);d+=(i?'L':'M')+q[0].toFixed(1)+' '+(q[1]+13).toFixed(1);}el(g,'path',{d:d,fill:'none',stroke:'#f1e6cc','stroke-width':2.5});}\n el(g,'line',{x1:X0-12,y1:YT,x2:X0-12,y2:YB+13,stroke:'#d8b46a','stroke-width':1.2,'stroke-dasharray':'5 4'});\n el(g,'line',{x1:X0-18,y1:YT,x2:X0+14,y2:YT,stroke:'#d8b46a','stroke-width':1.2,'stroke-dasharray':'5 4'});\n sim(g,16,(YT+YB)/2+6,P.simb_h||'h',P.sem_numeros?null:fmt(P.h,P.casas_h||0)+' m',true,{fill:'#d8b46a','text-anchor':'middle',transform:'rotate(-90 16 '+((YT+YB)/2+6)+')'});\n /* rastro em tempos iguais, corpo do enunciado e vetor velocidade (nasce no centro, proporcional ao modulo) */\n for(var k=0;k<=NP;k++){if(k/NP>u+1e-6)break;var uk=k/NP,q0=pos(e0?(0.45*uk+0.55*uk*uk):uk*uk);el(g,'circle',{cx:q0[0],cy:q0[1]+13,r:2.2,fill:'#d8b46a','fill-opacity':0.8});}\n var p2=pos(Math.min(w+0.01,1)),p1=pos(Math.max(w-0.01,0)),ang=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]),bx0=p[0]-CW/2,by=p[1]+13;\n figura(g,CF,bx0,by,CW,CH,'#ff9a3d',1);\n var cxc=p[0],cyc=by-CH/2,vr=Math.sqrt(Math.max((e0+w)/(1+e0)-P.perda*w/(1+e0),0))/VM;el(g,'circle',{cx:cxc,cy:cyc,r:2.6,fill:'#f1e6cc'});\n if(vr>0.001){var Lv=Math.max(vr*LV,LMIN);seta(g,cxc,cyc,cxc+Math.cos(ang)*Lv,cyc+Math.sin(ang)*Lv,'#ff9a3d',3);}\n if(pt&&pt.u===0){\n  sim(g,p[0]+CW/2+14,by-CH+8,'v₀',repouso?'0':null,val);\n  if(P.peso)sim(g,p[0]+CW/2+14,by-CH+30,'P',P.peso,true,{fill:'#f1e6cc'});\n  if(P.mostra_massa!==false)sim(g,p[0]+CW/2+14,by-CH+30,'m',P.sem_numeros?null:fmt(P.m,P.casas_m||0)+' kg',true,{fill:'#f1e6cc'});\n }\n if(pt&&pt.u===1){var E=P.m*10*P.h,v=Math.sqrt(2*E*(1-P.perda)/P.m);\n  if(!P.sem_v_final)sim(g,236,YB+34,'v',P.sem_numeros?null:(P.mostra_v_final?fmt(v,1)+' m/s':'?'),true,{'text-anchor':'end'});\n  if(P.delta_ec){var t=sim(g,16,YB+34,'ΔE',null,false,{fill:'#f1e6cc'});el(t,'tspan',{dy:4,'font-size':12},'c');el(t,'tspan',{dy:-4},' = '+P.delta_ec);}}\n if(!P.sem_numeros&&!P.sem_g)el(g,'text',{x:16,y:YB+34,'font-family':'Consolas,monospace','font-size':14,fill:'#f1e6cc'},'g = 10 m/s²');\n /* barras de energia: sempre visiveis, sem numeros */\n var ep=(1-w)/(1+e0),ed=P.perda*w/(1+e0),ec=(e0+w)/(1+e0)-ed,bx=[272,322,372],vs=[ep,ec,ed],cs=['#f1e6cc','#ff9a3d','#d8b46a'],ns=['potencial','cinética','dissipada'];\n el(g,'text',{x:340,y:30,'text-anchor':'middle','font-family':'Georgia,serif','font-size':16,fill:'#f1e6cc'},'Energia');\n el(g,'line',{x1:262,y1:YB+13,x2:416,y2:YB+13,stroke:'#f1e6cc','stroke-width':2});\n for(var i=0;i<3;i++){if(i===2&&P.perda===0)continue;\n  el(g,'rect',{x:bx[i]-17,y:YB+13-H*vs[i],width:34,height:Math.max(H*vs[i],0),fill:cs[i]});\n  el(g,'text',{x:bx[i],y:YB+30,'text-anchor':'middle','font-family':'Arial,sans-serif','font-size':12.5,fill:'#f1e6cc'},ns[i]);}\n if(P.perda>0&&pt&&pt.u===1)el(g,'text',{x:bx[2],y:YB+6-H*ed,'text-anchor':'middle','font-family':'Consolas,monospace','font-size':14,fill:'#d8b46a'},perdaDada?fmt(P.perda*100,0)+' %':'?');\n}\nCena({dur:3.2,desenhar:desenhar,temOculto:repouso,pontos:[{u:0,nome:'Início'},{u:1,nome:'Fim da descida'}]});\n\n})();\n<\/script><\/body><\/html>\n"}, "perguntas": [{"pergunta": "Por que o aumento da energia cinética é menor que a energia potencial que o esquiador perde na descida?", "resposta": "Porque parte da energia é retirada pelas forças de resistência (atrito com a neve e ar)."}, {"pergunta": "Por que o enunciado pede o trabalho das forças de resistência em módulo?", "resposta": "Porque esse trabalho é negativo: as forças são contrárias ao movimento e retiram energia mecânica."}, {"pergunta": "Se não houvesse forças de resistência, como ficaria o aumento da energia cinética comparado com a perda de energia potencial?", "resposta": "Seriam iguais: toda a energia potencial perdida viraria cinética."}], "resolucao": "Pela conservação de energia podemos admitir que a energia potencial gravitacional $\\left ( { E_{ pg } } \\right )$ no ponto mais alto da pista se transforma em energia cinética $\\left ( { E_{ c } } \\right )$ e energia dissipada pelo atrito $\\left ( { E_{ d } } \\right ).$\n\nAssim, equacionamos da seguinte maneira:\n\n$E_{ pg } =E_{ c } +E_{ d }$\n\nComo a variação da energia significa o trabalho, calculando a energia dissipada pelo atrito, temos o trabalho de resistência do trajeto na pista, então:\n\n$mgh=E_{ c } +E_{ d }$\n$\\Rightarrow  800\\cdot 25=1{,}4\\cdot 10 ^ { 4 } +E_{ d }$\n$800\\cdot 25-1{,}4\\cdot 10 ^ { 4 } =E_{ d }$\n$\\Rightarrow  E_{ d } =20000-14000$\n$\\therefore  E_{ d } =6000\\ J=6\\cdot 10 ^ { 3 } \\ J$", "gabarito": "D"}, {"id": "sp-201182", "refeitas": [], "fonte": "Ufjf-pism 1/2021", "bloco": "", "enunciado": "(Ufjf-pism 1) Um bloco de massa $M = 1kg$ 0é solto, partindo do repouso, do alto de um plano inclinado com altura $H = 5m,$ como indica a figura. 1Não há atrito entre o plano e o bloco. Ao término da descida, o bloco percorre uma distância D na horizontal e há atrito. Neste caso, o coeficiente de atrito cinético entre bloco e piso é dado por $\\mu = 0,5$ e a partir daí 3o piso fica liso novamente, de forma que o atrito pode ser desprezado. Sabendo que o bloco 2perde 75% de sua energia com dissipação por atrito e que $g = 10\\ m/s^{2},$ determine\n\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAb8AAAB/CAMAAABIUjxAAAAAkFBMVEX+/v78/Pz6+vr29vbw7/Do5+fl4+Xj4+Pi4eHf39/e3d7d3d3a2trW1dbU09PS09XQ0NDLysrDw8PAwMC8u7y0s7StrK2npqajoqObmZqVk5SOjI2Jh4iBf4B6eHlyb3BnZWViYGFaWFlST1BKR0hFQ0NCP0A9Ozw6ODg5Njc4NTY4NDY3NDY3NDU3NDQ3MzW4nIJlAAAHj0lEQVR42u1daWOiSBAFL9SgK8oNghxy7bL7// icando o teorema da energia cinética, chegamos a:\n\n$\\tau_{Fat} = {\\Delta E}_{C}$\n$- \\mu mgd = \\frac{{mv}_{A}^{2}}{2} - \\frac{{mv}^{2}}{2}$\n$- 0,2 \\cdot 1 \\cdot 10 \\cdot 1 = \\frac{1 \\cdot v_{A}^{2}}{2} - \\frac{1 \\cdot 40}{2}$\n$- 2 = \\frac{v_{A}\\ ^{2}}{2} - 20$\n$v_{A}^{2} = 18 \\cdot 2$\n$\\therefore v_{A} = 6\\ m/s$", "gabarito": "D"}, {"id": "sp-212013", "refeitas": [], "fonte": "Ufms/2022", "bloco": "", "enunciado": "(Ufms 2022) Visando à segurança em construções verticais na capital do estado de Mato Grosso do Sul, pesquisadores da UFMS fazem experiências com corpos em queda livre. Em um desses experimentos, 0partindo do repouso, um corpo 1é solto no ar, caindo verticalmente. Esse corpo tem uma massa de 8 kg e após percorrer 6 metros, atinge a velocidade de 10m/s. Com a utilização de um sensor, foi possível perceber que, durante a queda, as moléculas do corpo e do ar recebem energia que provoca 2elevação de temperatura do corpo. Ao analisar os dados, os pesquisadores perceberam que a energia mecânica perdida pelo corpo, em joules, foi de:\n\n(Use $g=\\frac { 10m } { s ^ { 2 } })$", "alternativas": [{"letra": "A", "texto": "50J."}, {"letra": "B", "texto": "60J."}, {"letra": "C", "texto": "70J."}, {"letra": "D", "texto": "80J."}, {"letra": "E", "texto": "100J."}], "dados": [{"trecho": "partindo do repouso", "significado": "v₀ = 0", "no_texto": true, "pergunta": "O que essa expressão informa sobre a velocidade inicial?"}, {"trecho": "é solto no ar", "significado": "há resistência do ar: a energia mecânica não se conserva", "no_texto": true, "pergunta": ""}, {"trecho": "elevação de temperatura do corpo", "significado": "a energia mecânica perdida virou energia térmica", "no_texto": true, "pergunta": ""}], "visual": {"tipo": "animacao", "conteudo": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Queda de 6 m com resistência do ar<\/title>\n< sma subida na metade do tempo, o trabalho do motor mudaria? E a potência?", "resposta": "O trabalho seria o mesmo; a potência dobraria."}], "resolucao": "A potência média útil é a relação entre a energia potencial adquirida e o tempo.\n\n$\\begin{aligned}P_{m} &= \\frac{E_{pot}}{\\Delta t} \\\\ &= \\frac{Mgh}{\\Delta t} \\\\ &= \\frac{(1600 + 800) \\cdot 10 \\cdot 36}{2 \\cdot 60} \\\\ &= 7.200\\ W\\end{aligned}$\n$\\Rightarrow  P_{m} = 7,2\\ kW$", "gabarito": "A"}, {"id": "sp-268763", "refeitas": [], "fonte": "Pucrs Medicina/2026", "bloco": "", "enunciado": "(Pucrs Medicina) A mera troca do elevador por um lance de escadas já significa quebra de sedentarismo. Andar dez mil passos por dia equivale a subir 12 andares. O uso de escadas aumenta a tonicidade da musculatura de membros inferiores e glúteos, melhora o sistema cardiovascular e pode propiciar a perda de peso.\n\nDisponível em: https://interfisio.com.br/trocar-o-elevador-por-um lance-de-escada-ja-significa-quebra-de-sedentarismo/. Acesso em: 08 set. 2025. (Adaptado)\n\nConsidere um adulto de 80 kg que leva 0quatro minutos para subir 10 andares utilizando as escadas. Se 1cada andar corresponde a uma elevação de três metros, qual é a 2potência média desenvolvida nesse esforço? \n\nConsidere g = 10 m/s<sup>2<\/sup>.", "alternativas": [{"letra": "A", "texto": "0,10 kW."}, {"letra": "B", "texto": "0,33 kW."}, {"letra": "C", "texto": "0,60 kW."}, {"letra": "D", "texto": "6,00 kW."}], "dados": [{"trecho": "quatro minutos", "significado": "tempo em minutos: passar para segundos", "no_texto": true, "pergunta": "Em que unidade o tempo precisa estar para a potência sair em watts?"}, {"trecho": "cada andar corresponde a uma elevação de três metros", "significado": "altura total = número de andares × 3 m", "no_texto": true, "pergunta": ""}, {"trecho": "potência média", "significado": "energia dividida pelo tempo total, sem precisar saber o ritmo de cada trecho", "no_texto": true, "pergunta": ""}], "visual": {"tip ende da massa e das velocidades."}, {"pergunta": "O que quer dizer um motor ter potência maior que outro?", "resposta": "Que ele transfere a mesma energia em menos tempo, ou mais energia no mesmo tempo."}], "resolucao": "Dados: $m = 1.500kg$\n$V_{0} = 0km/h$\n$V = 108km/h$\n$\\Rightarrow  V = 30m/s$\n$\\Delta t = 10s$\n\nEssa questão pode ser resolvida de duas maneiras:\n\nLembrando que:\n\n$d = V_{0} \\cdot \\Delta t + \\frac{1}{2} \\cdot a \\cdot {\\Delta t}^{2}$\n$\\Rightarrow  d = \\frac{1}{2} \\cdot a \\cdot {\\Delta t}^{2\\ }$\n\nVem:\n\n**<u>1ª opção<\/u>:**\n\n$P = \\frac{W}{\\Delta t}$\n$\\Rightarrow  P = \\frac{F \\cdot d}{\\Delta t}$\n$\\Rightarrow  P = \\frac{m \\cdot a \\cdot d}{\\Delta t}$\n$\\Rightarrow  P = \\frac{m \\cdot a \\cdot a \\cdot {\\Delta t}^{2}}{2 \\cdot \\Delta t}$\n$\\Rightarrow  P = \\frac{m \\cdot V^{2} \\cdot \\Delta t}{2 \\cdot {\\Delta t}^{2}}$\n$\\Rightarrow  P = \\frac{m \\cdot V^{2}}{2 \\cdot \\Delta t}$\n$\\Rightarrow  P = \\frac{1500 \\cdot 30^{2}}{2 \\cdot 10}$\n$\\Rightarrow  P = 67.500W$\n$\\Rightarrow  P = 67,5kW$\n\n**<u>2ª opção<\/u>:**\n\n$W = {\\Delta E}_{c}$\n$\\Rightarrow  W = \\frac{1}{2}m \\cdot v_{f}^{2} - \\frac{1}{2}m \\cdot v_{i}^{2}$\n$\\Rightarrow  W = \\frac{1}{2}m \\cdot v_{f}^{2} - 0$\n$P = \\frac{W}{\\Delta t}$\n$\\Rightarrow  P = \\frac{\\frac{1}{2}m \\cdot v_{f}^{2}}{\\Delta t}$\n$\\Rightarrow  P = \\frac{m \\cdot v_{f}^{2}}{2 \\cdot \\Delta t}$\n$\\Rightarrow  P = 67.500W$\n$\\Rightarrow  P = 67,5kW$", "gabarito": "E"}, {"id": "sp-204408", "refeitas": [], "fonte": "Enem/2021", "bloco": "", "enunciado": "(Enem) Analisando a ficha técnica de um automóvel popular, verificam-se algumas características em relação ao seu desempenho. Considerando 0o mesmo automóvel em duas versões, uma delas funcionando a álcool e outra, a gasolina, tem-se os dados apresentados no quadro, em relação ao desempenho de cada motor.\n\n| **Parâmetro**     | **Motor a gasolina**     | **Motor a álcool**       |\n|-------------------|--------------------------|--------------------------|\n| Aceleração        | 1de 0 a 100 km/h em 13,4s | de 0 a 100 km/h em 12,9s |\n| Velocidade máxima | 165 km/h                 | 163 km/h                 |\n\n2Considerando desprezível a resistência do ar, qual versão apresenta a maior potência?", "alternativas": [{"letra": "A", "texto": "Como a versão a gasolina consegue a maior aceleração, esta é a que desenvolve a maior potência."}, {"letra": "B", "texto": "Como a versão a gasolina atinge o maior valor de energia cinética, esta é a que desenvolve a maior potência."}, {"letra": "C", "texto": "Como a versão a álcool apresenta a maior taxa de variação de energia cinética, esta é a que desenvolve a maior potência."}, {"letra": "D", "texto": "Como ambas as versões apresentam a mesma variação de velocidade no cálculo da aceleração, a potência desenvolvida é a mesma."}, {"letra": "E", "texto": "Como a versão a gasolina fica com o motor trabalhando por mais tempo para atingir os 100 km/h, esta é a que desenvolve a maior potência."}], "dados": [{"trecho": "o mesmo automóvel", "significado": "mesma massa nas duas versões", "no_texto": true, "pergunta": ""}, {"trecho": "de 0 a 100 km/h em 13,4s", "significado": "mesma variação de velocidade nas duas versões; só o tempo muda", "no_texto": true, "pergunta": ""}, {"trecho": "Considerando desprezível a resistência do ar", "significado": "todo o trabalho do motor vira energia cinética", "no_texto": true, "pergunta": ""}], "visual": {"tipo": "animacao", "conteudo": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>De 0 a 100 km/h: gasolina e álcool<\/title>\n<style>body{margin:0;background:#0b1a2e;color:#f1e6cc;font-family:Arial,Helvetica,sans-serif}\nh1{font-family:Georgia,serif;font-size:21px;font-weight:normal;letter-spacing:.3px;margin:10px 14px 2px;color:#f1e6cc}\n.exp{margin:8px 14px 4px;padding-top:8px;border-to eturn x.u<u-TOL;});parar();u=(a[a.length-1]||P[P.length-1]).u;d();};\n var R=o.rotulos||['Revelar dados ocultos','Esconder dados ocultos'],r1=R[0],r2=R[1];$('bv').textContent=r1;\n if(!o.rotulos&&o.temOculto===false)$('bv').style.display='none'; /* cena sem dado oculto: o botao nao teria o que revelar */\n $('bv').onclick=function(){val=!val;this.textContent=val?r2:r1;this.className=val?'sel':'';d();};\n d();\n}\n/* rotulo de grandeza. Dado explicito do enunciado: passar mostra=true (letra = valor, ou \"?\" se e a grandeza pedida).\n   Dado oculto (\"parte do repouso\"): passar mostra=valores, e so a letra aparece ate o aluno pedir para revelar. */\nfunction sim(pai,x,y,letra,valor,val,at){var a={x:x,y:y,'class':'s','font-family':'Georgia,serif','font-style':'italic','font-size':17,fill:'#ff9a3d'};for(var k in at)a[k]=at[k];\n return el(pai,'text',a,letra+((val&&valor!=null)?' = '+valor:''));}\n\n(function(){\nvar P={\"carros\": [{\"nome\": \"carro solar\", \"dt\": 1, \"rot_dt\": \"?\"}], \"forma\": \"carro\", \"v0\": {\"valor\": \"0\", \"oculto\": true}, \"vf\": \"108 km/h\", \"m\": \"200 kg\", \"dados\": [[\"I\", \"1.000 W/m²\"], [\"A\", \"9,0 m²\"], [\"η\", \"30 %\"]], \"sol\": true, \"palpite\": {\"pergunta\": \"De toda a energia solar que chega ao painel, quanto vira energia de movimento do carro: tudo ou só uma parte?\"}};\nfrase(P);\n/* P: carros [{nome, dt (tempo ate a velocidade final, so para o movimento; o maior define a duracao), rot_dt (\"10 s\" | \"?\"), nome_fim}] (1 ou 2),\n   forma (carro...), v0 ({valor, oculto}), vf (texto, \"108 km/h\"), m (texto), dados [[letra, valor], ...] (outros dados explicitos,\n   mostrados na partida; so com 1 veiculo), sol (true desenha o Sol e os raios chegando ao veiculo), dur */\nvar g=$('g'),C=P.carros,n=C.length,FM=P.forma||'carro',BW=70,BH=Math.round(BW*(FORMAS[FM]||0.42)),X0=10,X1=300-BW,LV=60,LMIN=18,NP=10;\nvar tmax=Math.max.apply(null,C.map(function(c){return c.dt||1;})),YS=n===1?[168]:[112,212],CORES=['#ff9a3 mento da energia potencial elástica."}, {"letra": "D", "texto": "diminuição da quantidade de movimento."}, {"letra": "E", "texto": "aumento da quantidade de movimento."}], "dados": [{"trecho": "deformações definitivas", "significado": "a colisão não é perfeitamente elástica: parte da energia cinética não volta a ser movimento", "no_texto": true, "pergunta": ""}, {"trecho": "sistema físico formado por esses dois automóveis", "significado": "as forças da colisão são internas ao sistema", "no_texto": true, "pergunta": ""}], "visual": null, "perguntas": [{"pergunta": "Por que a quantidade de movimento do sistema não diminui mesmo com os carros amassados?", "resposta": "Porque as forças entre os carros são internas e formam pares de ação e reação; elas não alteram a quantidade de movimento total."}, {"pergunta": "Para onde vai a energia mecânica que deixa de existir na colisão?", "resposta": "É usada para deformar as estruturas e vira energia térmica e som."}, {"pergunta": "Se os carros voltassem exatamente à forma original depois do choque, que tipo de colisão poderia ser?", "resposta": "Poderia ser perfeitamente elástica, com conservação da energia cinética."}], "resolucao": "Se as deformações foram definitivas, significa que houve diminuição da energia mecânica durante a colisão. A energia mecânica somente se conserva quando a colisão é perfeitamente elástica.", "gabarito": "B"}, {"id": "sp-249826", "refeitas": [], "fonte": "Utfpr/2024", "bloco": "", "enunciado": "(Utfpr 2024) Popularmente, o estilingue é conhecido como: “Arco atirador com elásticos presos pelas extremidades que, sendo ativado por um gatilho, arremessa pedrinhas, bolas de argila; atiradeira, badoque, bodoque.”\n\n(Fonte: https://www.dicio.com.br/estilingue/)\n\nConsidere um corpo de argila com massa de 60g lançado de um estilingue colidindo horizontalmente com um bloco de tijolo liso de massa 240g. Sabendo que, no momento da colisão, o corpo de argila apresentava uma velocidade horizontal de 5,0m/s e P.forEach(function(x){if(Math.abs(u-x.u)<TOL)p=x;});return (rod&&!espera)||alvo!==null?null:p;}\n function d(){var p=ponto();o.desenhar(u,val,p);$('pt').textContent=p?p.nome:'';$('cur').style.left=(u*100)+'%';\n  P.forEach(function(x){x._b.className='mk'+(p===x?' on':(x.u<u+TOL?' ja':''));});\n  $('ico').setAttribute('d',rod?'M7 5h4v14H7zM13 5h4v14h-4z':'M8 5v14l11-7z');$('bi').setAttribute('aria-label',rod?'Pausar':'Iniciar');}\n function parar(){cancelAnimationFrame(raf);rod=false;alvo=null;espera=0;}\n /* play: o movimento segue no ritmo fisico e faz uma pausa curta em cada ponto de parada do meio do caminho */\n function passo(t){if(t0===null)t0=t;var dt=Math.min((t-t0)/1000,0.05);t0=t;\n  if(espera>0){espera-=dt;if(espera<=0){espera=0;d();}raf=requestAnimationFrame(passo);return;}\n  var un=Math.min(u+dt/o.dur,1),pp=P.filter(function(x){return x.u>u+1e-9&&x.u<=un+1e-9&&x.u<1-TOL;})[0];\n  if(pp){u=pp.u;espera=PAUSA;rod=false;d();rod=true;$('ico').setAttribute('d','M7 5h4v14H7zM13 5h4v14h-4z');raf=requestAnimationFrame(passo);return;}\n  u=un;if(u>=1){rod=false;d();return;}d();raf=requestAnimationFrame(passo);}\n /* setas e marcos: a cena viaja ate o ponto, em vez de saltar */\n function viagem(t){if(t0===null)t0=t;tv+=Math.min((t-t0)/1000,0.05);t0=t;var k=Math.min(tv/VIAGEM,1);u=u0+(alvo-u0)*k;\n  if(k>=1){u=alvo;alvo=null;d();return;}d();raf=requestAnimationFrame(viagem);}\n function ir(x){parar();if(Math.abs(x-u)<TOL){d();return;}if(x<u&&!o.voltaSuave){u=x;d();return;}\n  alvo=x;u0=u;tv=0;t0=null;raf=requestAnimationFrame(viagem);d();}\n $('bi').onclick=function(){if(rod){parar();}else{parar();if(u>=1)u=0;rod=true;t0=null;raf=requestAnimationFrame(passo);}d();};\n $('bp').onclick=function(){var n=P.filter(function(x){return x.u>u+TOL;})[0];if(n)ir(n.u);else{parar();u=P[0].u;d();}};\n $('ba').onclick=function(){var a=P.filter(function(x){return x.u<u-TOL;});parar();u=(a[a.length-1]||P[P.length-1]).u;d();};\n var R=o.rotulos||['Revelar dados ocultos','Esconder ação da quantidade de movimento é a mesma", "no_texto": true, "pergunta": ""}], "visual": null, "perguntas": [{"pergunta": "Por que o impulso sobre o carro é o mesmo na parede e no feno?", "resposta": "Porque nos dois casos o carro vai da mesma velocidade até o repouso, então a variação da quantidade de movimento é a mesma."}, {"pergunta": "O que o impulso de uma força mede?", "resposta": "O efeito da força acumulado no tempo, igual à variação da quantidade de movimento que ela provoca."}, {"pergunta": "O que airbags e para-choques deformáveis têm em comum com o monte de feno?", "resposta": "Aumentam o tempo da colisão, o que reduz a força para o mesmo impulso."}], "resolucao": "Pelo teorema do impulso:\n\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAdAAAABgCAIAAAAigrSWAAATWklEQVR42u2daVRT19fGt4CAIiogEBFbBMGBQami4rRsBQcqglWXSqt0WQdQWxTBAW0rtQp1aKvIUlutdcJWrUtqrSVYB1RgOYAiUkGEMChhkhlkMu+Hs8ybv0C4CSSE+Pw+hXsPJzc75z7Zd5999ukiEokIAACA4tGACQAAAIILAAAQXAAAABBcAIAYPz8/Pz8/2KGj8PLyeuNIF0yaAaCWCASCAQMGwA4di4uLS3R0NAQXAPWnS5cuRIR7vAPt/4bxEVIAAABCDBcAACC4AAAAILgAAADBBQAACC4AAAAILgAAQHABAABAcAEAAIILAAAQXAAAABBcAACA4AIAAIDgAgCAiqIFEwAA1IOsrCw3N7cjR46MGjWKWisW/Pjx46Kiovr6egMDg8GDBw8aNIhVs1QoqIcLAKEernqwdOnSQ4cOubq68vn8ZhtUVlaGh4f/9NNPGRkZb5zq27evt7e3v7+/sbGx4urhQnABgOCSeuxwMXjw4NraWiK6efPmuHHj3miQkJDg6emZk5PD/rSysjI3N9fU1Hz+/HlqaiqzkpGR0bFjx9zc3BQkuCQCAKgpb9U9vmTJkr179+rr6xORq6vrG2fv3bvXvXt3ItLS0lq9enV2drbkWaFQGBQUpKurS0SampoXL15sL/u/eQSDEgAIbmcnMzPTzs6usbExKCiIfeqbN2+Kz1ZWVlpYWBCRrq7uP//801InN27cYHptYGBQWFioCMFFlgIAoNOzbdu2jRs3amho+Pv79+jRg4iCg4PFZw8ePCgQCIgoNDR06tSpLXUyfvz48PBwIiopKQkNDcWkGQAAMdxmorfu7u4PHjzQ0NAgoqCgoJCQECK6devW2LFjicja2jo9Pd3MzCwrK0tLq5XULDs7u0ePHhkaGhYUFGhqamITSQAA+H+2b9/O3Fv259q1ayWd3Nzc3PT0dCKaM2dOq2pLRB9//DERvXjx4s6dO4SFDwAAQBK5t/Hx8fPnzxcfMTIyWrlyJRHx+fzY2Nj79++z46NHj+bS4ZgxY9iL5ORkCC4AAJBk9HbDhg1i95YREBCgp6fHnNyioiJ6nWnLpUMzMzP2QigUQnABAKBF95bRp08fsZP78OFDdrBbt25c+mRKTUQspReCCwAARE2it806uVFRUexIeXk5lz7LysrYi169eqmQ4CK9AQDQse5tXFzcvHnzmj1rbGy liche ou partículas subatômicas. O estudo dos choques faz parte do conteúdo do ramo da Física chamado Mecânica. Nesse âmbito, considerando que 0as forças trocadas durante o choque sejam muito mais intensas que as forças externas, assinale o que for correto.\n\n01) Em qualquer tipo de choque, a quantidade de movimento é conservada.\n\n02) O choque chamado inelástico ou plástico caracteriza-se pelo fato de que 1os corpos permanecem juntos após a colisão.\n\n04) Nos choques perfeitamente elásticos, além de o momento linear ser conservado, a energia cinética também o é; e seu 2coeficiente de restituição tem valor unitário.\n\n08) Os choques que ocorrem entre as partículas de um gás perfeito ou ideal são considerados colisões parcialmente elásticas.", "alternativas": [], "dados": [{"trecho": "as forças trocadas durante o choque sejam muito mais intensas que as forças externas", "significado": "o sistema pode ser tratado como isolado: a quantidade de movimento total se conserva", "no_texto": true, "pergunta": ""}, {"trecho": "os corpos permanecem juntos após a colisão", "significado": "mesma velocidade final para os dois corpos", "no_texto": true, "pergunta": "O que acontece com os corpos depois do choque? O que se conserva?"}, {"trecho": "coeficiente de restituição tem valor unitário", "significado": "a velocidade relativa de afastamento é igual à de aproximação", "no_texto": true, "pergunta": ""}], "visual": null, "perguntas": [{"pergunta": "Por que a quantidade de movimento se conserva até nos choques em que há perda de energia?", "resposta": "Porque ela só depende de forças externas; as forças do choque são internas e se cancelam aos pares."}, {"pergunta": "O que o coeficiente de restituição compara?", "resposta": "A velocidade relativa com que os corpos se afastam com a velocidade relativa com que se aproximavam."}, {"pergunta": "Se as colisões entre as partículas de um gás não fossem perfeitamente elásticas, o que aconteceria com a agitação delas ao longo do tempo?", "resposta": "Diminuiria aos poucos, pois a cada choque se perderia energia cinética."}], "resolucao": "01 + 02 + 04 = 07.\n\n[01] **(Correta)**. Na condição exposta, o sistema pode ser considerado mecanicamente isolado, ocorrendo conservação da quantidade de movimento (momento linear).\n\n[02] **(Correta)**.\n\n[04] **(Correta)**.\n\n[08] **(Incorreta)**. Uma das hipóteses da teoria cinética dos gases é que as partículas só trocam forças durante os choques e que esses choques são **<u>perfeitamente elásticos<\/u>**.", "gabarito": "07"}, {"id": "rot3t25-19", "refeitas": [], "fonte": "Fuvest-Ete 2022", "bloco": "", "enunciado": "(Fuvest-Ete 2022) Um projétil de 5,00 g é disparado horizontalmente contra um bloco de madeira de 495 g 0que estava em repouso sobre uma superfície horizontal. Após a 1colisão totalmente inelástica, o bloco é lançado a 2,00 m/s na mesma direção e sentido inicial do projétil.\n\nA velocidade do projétil antes do choque era de:\n\n**Note e Adote:**\n\n2Despreze a resistência do ar e o atrito do bloco com o plano.", "alternativas": [{"letra": "A", "texto": "100 m/s"}, {"letra": "B", "texto": "200 m/s"}, {"letra": "C", "texto": "300 m/s"}, {"letra": "D", "texto": "400 m/s"}, {"letra": "E", "texto": "500 m/s"}], "dados": [{"trecho": "que estava em repouso", "significado": "velocidade inicial do bloco: v = 0", "no_texto": true, "pergunta": "O que essa expressão informa sobre a velocidade inicial?"}, {"trecho": "colisão totalmente inelástica", "significado": "o projétil fica preso: os dois saem juntos, com a mesma velocidade", "no_texto": true, "pergunta": "O que acontece com os corpos depois do choque? O que se conserva?"}, {"trecho": "Despreze a resistência do ar e o atrito do bloco com o plano", "significado": "não há força externa horizontal: a quantidade de movimento do sistema se conserva", "no_texto": true, "pergunta": ""}], "visual": {"tipo": "animacao", "conteudo": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charse 0.5,0.14,0.6],[0.5,0.88,0.6],[0.08,0.52,0.55],[0.92,0.55,0.6]],R0=Math.min(w,h)*0.085;\n  pts.forEach(function(q){a('circle',{cx:x+q[0]*w,cy:yt+q[1]*h,r:R0*q[2],'fill-opacity':0.6,'stroke-width':1});});\n }else if(forma==='projetil'){\n  a('path',{d:'M'+X(0.02)+' '+yb+'L'+X(0.02)+' '+yt+'L'+X(0.62)+' '+yt+'Q'+X(0.98)+' '+(yt+h*0.1)+' '+X(0.99)+' '+(yt+h/2)+'Q'+X(0.98)+' '+(yb-h*0.1)+' '+X(0.62)+' '+yb+'Z'});\n  a('line',{x1:X(0.2),y1:yt,x2:X(0.2),y2:yb},L);\n }else a('rect',{x:x,y:yt,width:w,height:h,rx:5});\n return g;}\nfunction frase(P){ /* \"Explorando o problema\": a pergunta de previsao, sem botoes */\n var p=P.palpite;if(!p||!p.pergunta){$('exp').style.display='none';return;}\n var t=p.pergunta.trim();\n if(!/\\?$/.test(t)&&p.opcoes){var o=p.opcoes.map(function(x){return x[0];});t+=' '+o.slice(0,-1).join(', ')+' ou '+o[o.length-1]+'?';}\n $('expt').textContent=t;}\nfunction Cena(o){\n var u=0,t0=null,raf=null,rod=false,val=false,TOL=0.004,alvo=null,espera=0,PAUSA=0.9,VIAGEM=0.7,u0=0,tv=0;\n var P=o.pontos,ciclo=!!o.ciclo;\n /* linha do tempo: um marco por ponto de parada e um cursor que acompanha a cena */\n var lt=$('lt');P.forEach(function(x,i){var b=document.createElement('button');b.className='mk';b.style.left=(x.u*100)+'%';b.setAttribute('aria-label',x.nome);\n  b.onclick=function(){ir(x.u);};lt.appendChild(b);x._b=b;});\n function ponto(){var p=null;P.forEach(function(x){if(Math.abs(u-x.u)<TOL)p=x;});return (rod&&!espera)||alvo!==null?null:p;}\n function d(){var p=ponto();o.desenhar(u,val,p);$('pt').textContent=p?p.nome:'';$('cur').style.left=(u*100)+'%';\n  P.forEach(function(x){x._b.className='mk'+(p===x?' on':(x.u<u+TOL?' ja':''));});\n  $('ico').setAttribute('d',rod?'M7 5h4v14H7zM13 5h4v14h-4z':'M8 5v14l11-7z');$('bi').setAttribute('aria-label',rod?'Pausar':'Iniciar');}\n function parar(){cancelAnimationFrame(raf);rod=false;alvo=null;espera=0;}\n /* play: o movimento segue no ritmo fisico e faz uma pausa curta em cada ponto de parada do meio do cami steira se move horizontalmente com 1velocidade constante e igual a 2 m/s (em módulo). Considere o coeficiente de atrito cinético igual a 0,5 entre a caixa e a esteira e o módulo da aceleração da gravidade igual a 10 m/s<sup>2<\/sup>. Além disso, considere que o solo seja um referencial inercial e despreze a resistência do ar. Assinale o que for correto.\n\n01) Do referencial da pessoa, a quantidade de movimento (em módulo) adquirida pela caixa, do momento em que entra em contato com a esteira até começar a se movimentar solidariamente a ela, é de $4N\\cdot s.$\n\n02) Do referencial da pessoa, a energia cinética adquirida pela caixa, do momento em que entra em contato com a esteira até começar a se movimentar solidariamente a ela, é 4 J.\n\n04) O referencial da esteira pode ser considerado um referencial inercial.\n\n08) Do referencial da esteira, o módulo da velocidade da caixa no instante em que ela entra em contato com a esteira é de 2 m/s.\n\n16) O intervalo de tempo entre o instante em que a caixa entra em contato com a esteira e o instante em que a caixa passa a se movimentar solidariamente a ela é de 0,4 s.", "alternativas": [], "dados": [{"trecho": "solta, de uma altura desprezível", "significado": "a caixa chega à esteira com velocidade nula em relação ao solo", "no_texto": true, "pergunta": ""}, {"trecho": "velocidade constante", "significado": "a esteira não acelera: também serve como referencial inercial", "no_texto": true, "pergunta": "Se a velocidade não muda, quanto vale a aceleração? E a força resultante?"}, {"trecho": "se movimentar solidariamente a ela", "significado": "a caixa passa a ter a velocidade da esteira: 2 m/s em relação ao solo", "no_texto": false, "pergunta": ""}], "visual": {"tipo": "svg", "conteudo": "<svg viewBox=\"0 0 680 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Pessoa parada em relação ao solo solta uma caixa de 2 kg sobre uma esteira que se move a 2 m/s. Coeficiente de atrito cinético 0,5.\"><style id =\"#f1e6cc\">2 kg<\/text>\n  <line x1=\"314\" y1=\"218\" x2=\"380\" y2=\"218\" stroke=\"#ff9a3d\" stroke-width=\"4\" marker-end=\"url(#st)\"/>\n  <text x=\"336\" y=\"204\" font-family=\"Georgia, serif\" font-size=\"22\" font-style=\"italic\" fill=\"#ff9a3d\">F<tspan font-size=\"14\" dy=\"5\">at<\/tspan><\/text>\n  <text x=\"282\" y=\"124\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#f1e6cc\">no instante do contato:<\/text>\n  <text x=\"282\" y=\"148\" text-anchor=\"middle\" font-family=\"Consolas, monospace\" font-size=\"18\" fill=\"#f1e6cc\">v = 0 em relação ao solo<\/text>\n  <!-- pessoa -->\n  <g stroke=\"#f1e6cc\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\">\n    <line x1=\"110\" y1=\"186\" x2=\"110\" y2=\"270\"/><line x1=\"110\" y1=\"270\" x2=\"92\" y2=\"338\"/><line x1=\"110\" y1=\"270\" x2=\"130\" y2=\"338\"/>\n    <line x1=\"110\" y1=\"206\" x2=\"200\" y2=\"178\"/>\n  <\/g>\n  <circle cx=\"110\" cy=\"168\" r=\"17\" fill=\"#14294a\" stroke=\"#f1e6cc\" stroke-width=\"3\"/>\n  <text x=\"170\" y=\"366\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#f1e6cc\">pessoa em repouso em relação ao solo<\/text>\n  <!-- dados -->\n  <text x=\"436\" y=\"120\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#f1e6cc\">atrito cinético caixa e esteira<\/text>\n  <text x=\"450\" y=\"146\" font-family=\"Consolas, monospace\" font-size=\"19\" fill=\"#f1e6cc\">μ = 0,5<\/text>\n  <text x=\"450\" y=\"176\" font-family=\"Consolas, monospace\" font-size=\"19\" fill=\"#f1e6cc\">g = 10 m/s²<\/text>\n  <text x=\"450\" y=\"366\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#f1e6cc\">sem resistência do ar<\/text>\n<text id=\"credito\" x=\"672\" y=\"394\" text-anchor=\"end\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"12\" fill=\"#d8b46a\" opacity=\".85\">Prof. Bruno Bueno<\/text>\n<\/svg>\n"}, "perguntas": [{"pergunta": "Que força acelera a caixa, e por que ela aponta no sentido do movimento da esteira?", "resposta": "O atrito cinético. A caixa escorrega para trás em relação à esteira, e o atrito se opõe a esse escorregamento."}, {"pergunta": "Para quem está sobre a esteira, como é o movimento da caixa logo depois do contato?", "resposta": "A caixa chega com velocidade para trás e vai freando até parar em relação à esteira."}, {"pergunta": "Com um coeficiente de atrito menor, a velocidade final da caixa mudaria?", "resposta": "Não. Ela ainda chegaria à velocidade da esteira, só demoraria mais."}], "resolucao": "01 + 02 + 04 + 08 + 16 = 31.\n\n[01] Verdadeira. Quando a caixa entra em contato solidariamente com a esteira, a quantidade de movimento é:\n\n> $Q=m\\cdot v$\n$\\Rightarrow  Q=2\\ kg\\cdot 2\\ \\frac { m } { s }$\n$\\therefore  Q=4\\ N\\cdot s$\n\n[02] Verdadeira. A energia cinética é dada por $\\begin{aligned}E_{ c } &= \\frac { m\\cdot v ^ { 2 } } { 2 } \\\\ &= \\frac { 2\\ kg\\cdot \\left ( { 2\\ \\frac { m } { s } } \\right ) ^ { 2 } } { 2 }\\end{aligned}$\n$\\therefore  E_{ c } =4\\ J$\n\n[04] Verdadeira. O referencial da esteira é considerado um referencial inercial, pois a aceleração é nula uma vez que sua velocidade é constante.\n\n[08] Verdadeira. No momento do contato com a esteira, a caixa passa a se movimentar com a mesma e neste momento a caixa têm o mesmo módulo da velocidade da esteira.\n\n[16] Verdadeira. Usando o Teorema do Impulso, sabendo-se que a velocidade inicial é nula e a velocidade final é igual à da esteira e que a força resultante sobre a caixa é a força de atrito, tem-se:\n\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjEAAACjCAIAAAD0PNjCAAA49ElEQVR42u2deVyN2f/AP5WKNmm9UVJKlhYRI7KHEspWKmRSGTKawaAZX8QUQhhjzJgxGqXIbrSKpFUIZSxhWlXatWq79/fHeXl+d+693e7W/nn/Ved57nme55zP83zO+ZzP+XzEGAwGIAiCIEg3QBybAEEQBEGdhCAIgiCokxAEQRDUSQiC9GXc3d3t7OwiIyMB4Ny5cxYWFurq6tra2gsXLkxMTCTnZGVlrV27Vl9fX1lZ2cjI6H//+19DQ4NglwsKCrKzs1u8eHFtbS3HEwICAuzs7NasWYNd030QQx8HBEE6BwMDg6ysLH9//7KyMn9/f2lp6dbW1paWFgC  o chão; o chão reage sobre ele com força de mesmo módulo e sentido oposto", "no_texto": true, "pergunta": ""}, {"trecho": "força média", "significado": "valor único que representa a força durante o contato: o impulso é força média vezes tempo", "no_texto": true, "pergunta": ""}, {"trecho": "o impulso que o chão exerce sobre o boxeador", "significado": "pede-se o impulso da reação, não o da força que o boxeador faz", "no_texto": true, "pergunta": ""}, {"trecho": "Em cada pulo", "significado": "o tempo dado é o de um único contato com o chão", "no_texto": true, "pergunta": ""}], "visual": {"tipo": "svg", "conteudo": "<svg viewBox=\"0 0 680 380\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Boxeador pulando corda. Ele exerce sobre o chão uma força média de 1,0 vezes 10 à quarta newtons, durante 2,0 vezes 10 à menos 2 segundo por pulo. Pede-se o impulso do chão sobre o boxeador.\"><style id=\"estilo\">text{paint-order:stroke;stroke:#0b1a2e;stroke-width:3px;stroke-linejoin:round}[stroke=\"#ff9a3d\"],[fill=\"#ff9a3d\"]:not(text){filter:drop-shadow(0 0 4px rgba(255,154,61,.7))}<\/style>\n<rect width=\"680\" height=\"380\" fill=\"#0b1a2e\"/>\n<text x=\"340\" y=\"36\" text-anchor=\"middle\" font-family=\"Georgia,serif\" font-size=\"23\" fill=\"#f1e6cc\">Boxeador pulando corda: o contato com o chão<\/text>\n<rect x=\"40\" y=\"290\" width=\"600\" height=\"22\" fill=\"#1d3558\" stroke=\"#f1e6cc\" stroke-width=\"2\"/>\n<path d=\"M118 172C60 40 300 40 244 172\" fill=\"none\" stroke=\"#d8b46a\" stroke-width=\"2\"/>\n<g fill=\"none\" stroke=\"#ff9a3d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"181\" cy=\"96\" r=\"17\" fill=\"#ff9a3d\" stroke=\"none\"/><line x1=\"181\" y1=\"116\" x2=\"181\" y2=\"204\"/><polyline points=\"181,134 148,160 118,172\"/><polyline points=\"181,134 214,160 244,172\"/><polyline points=\"181,204 166,246 172,288\"/><polyline points=\"181,204 196,246 190,288\"/><\/g>\n<line x1=\"181\" y1=\"296\" x2=\"181\" y2=\"350\" stroke=\"#f1e6cc\" stroke-width=\"4\"/><path d=\"M181 366l-9 -20h18z\" fill=\"#f1e6cc\"/>\n<text x=\"204\" y=\"340\" text-anchor=\"start\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#f1e6cc\">força média do boxeador sobre o chão<\/text>\n<text x=\"204\" y=\"366\" text-anchor=\"start\" font-family=\"Consolas,monospace\" font-size=\"20\" fill=\"#f1e6cc\">F = 1,0·10⁴ N<\/text>\n<text x=\"300\" y=\"130\" text-anchor=\"start\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#f1e6cc\">em cada pulo, o pé fica em<\/text>\n<text x=\"300\" y=\"154\" text-anchor=\"start\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#f1e6cc\">contato com o chão por<\/text>\n<text x=\"300\" y=\"182\" text-anchor=\"start\" font-family=\"Consolas,monospace\" font-size=\"20\" fill=\"#f1e6cc\">Δt = 2,0·10⁻² s<\/text>\n<text x=\"300\" y=\"236\" text-anchor=\"start\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#ff9a3d\">impulso do chão sobre o boxeador:<\/text>\n<text x=\"300\" y=\"264\" text-anchor=\"start\" font-family=\"Georgia,serif\" font-size=\"22\" fill=\"#ff9a3d\" font-style=\"italic\">I = ?<\/text>\n<text id=\"credito\" x=\"672\" y=\"374\" text-anchor=\"end\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"12\" fill=\"#d8b46a\" opacity=\".85\">Prof. Bruno Bueno<\/text>\n<\/svg>\n"}, "perguntas": [{"pergunta": "Por que se pode usar a força que o boxeador faz no chão para achar o impulso que o chão faz nele?", "resposta": "Porque as duas formam um par de ação e reação: têm o mesmo módulo e atuam durante o mesmo tempo."}, {"pergunta": "O que quer dizer \"força média\" em um contato tão rápido?", "resposta": "É o valor constante que, no mesmo tempo, produziria o mesmo impulso da força real, que varia durante o contato."}, {"pergunta": "Se o boxeador amortecesse o pulo, ficando mais tempo em contato com o chão para receber o mesmo impulso, a força média seria maior ou menor?", "resposta": "Menor: o mesmo impulso distribuído em mais tempo exige força menor."}], "resolucao": "O impulso de uma força média é o produto da força pelo tempo em que ela atua:\n\n$$I = F \\cdot \\Delta t = 1{,}0 \\cdot 10^{4} \\cdot 2{,}0 \\cdot 10^{-2} = 2{,}0 \\cdot 10^{2}\\ N \\cdot s$$\n\nAlternativa **C**.", "gabarito": "C"}, {"id": "sp-112973", "refeitas": [], "fonte": "Ufsm/2012", "bloco": "", "enunciado": "(Ufsm) Uma corrida de 100 metros rasos inicia com um disparo. Um atleta de 85 kg 0parte do repouso e alcança, em 2 segundos, uma velocidade de módulo constante e igual a 22 m/s. O módulo do impulso médio que o atleta recebe nesses 2 segundos, 1no SI, é", "alternativas": [{"letra": "A", "texto": "170."}, {"letra": "B", "texto": "425."}, {"letra": "C", "texto": "1425."}, {"letra": "D", "texto": "1870."}, {"letra": "E", "texto": "38140."}], "dados": [{"trecho": "parte do repouso", "significado": "v₀ = 0: a quantidade de movimento inicial é nula", "no_texto": true, "pergunta": "O que essa expressão informa sobre a velocidade inicial?"}, {"trecho": "no SI", "significado": "impulso em N·s, que é o mesmo que kg·m/s", "no_texto": true, "pergunta": ""}], "visual": {"tipo": "svg", "conteudo": "<svg viewBox=\"0 0 680 370\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Atleta de 85 kg parte do repouso e, depois de 2 segundos, tem velocidade de 22 m/s. O impulso médio recebido é a grandeza pedida.\"><style id=\"estilo\">text{paint-order:stroke;stroke:#0b1a2e;stroke-width:3px;stroke-linejoin:round}[stroke=\"#ff9a3d\"],[fill=\"#ff9a3d\"]:not(text){filter:drop-shadow(0 0 4px rgba(255,154,61,.7))}<\/style>\n  <defs>\n    <marker id=\"st\" markerUnits=\"userSpaceOnUse\" markerWidth=\"12\" markerHeight=\"12\" refX=\"11\" refY=\"6\" orient=\"auto\"><path d=\"M0,0 L12,6 L0,12 z\" fill=\"#ff9a3d\"/><\/marker>\n    <marker id=\"sa\" markerUnits=\"userSpaceOnUse\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f1e6cc\"/><\/marker>\n  <\/defs>\n  <rect width=\"680\" height=\"370\" fill=\"#0b1a2e\"/>\n  <text x=\"340\" y=\"34\" text-anchor=\"middle\" font-family=\"Georgia, serif\" font-size=\"23\" font-weight=\"bold\" fill=\"#f1e6cc\">Largada da corrida de 100 m<\/text>\n  <text x=\"340\" y=\"68\" text-anchor=\"middle\" font-family=\"Consolas, monospace\" font-size=\"19\" fill=\"#f1e6cc\" >atleta de 85 kg<\/text>\n  <line x1=\"40\" y1=\"232\" x2=\"640\" y2=\"232\" stroke=\"#f1e6cc\" stroke-width=\"3\"/>\n  <g stroke=\"#f1e6cc\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"><circle cx=\"140\" cy=\"150\" r=\"11\" fill=\"#14294a\"/><line x1=\"140\" y1=\"161\" x2=\"140\" y2=\"198\"/><line x1=\"140\" y1=\"198\" x2=\"127\" y2=\"230\"/><line x1=\"140\" y1=\"198\" x2=\"153\" y2=\"230\"/><line x1=\"125\" y1=\"180\" x2=\"155\" y2=\"174\"/><\/g>\n  <g stroke=\"#f1e6cc\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"><circle cx=\"470\" cy=\"150\" r=\"11\" fill=\"#14294a\"/><line x1=\"470\" y1=\"161\" x2=\"470\" y2=\"198\"/><line x1=\"470\" y1=\"198\" x2=\"457\" y2=\"230\"/><line x1=\"470\" y1=\"198\" x2=\"483\" y2=\"230\"/><line x1=\"455\" y1=\"180\" x2=\"485\" y2=\"174\"/><\/g>\n  <line x1=\"185\" y1=\"185\" x2=\"420\" y2=\"185\" stroke=\"#f1e6cc\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" marker-end=\"url(#sa)\"/>\n  <text x=\"302\" y=\"172\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#f1e6cc\" >2 s depois<\/text>\n  <line x1=\"492\" y1=\"185\" x2=\"590\" y2=\"185\" stroke=\"#ff9a3d\" stroke-width=\"4\" marker-end=\"url(#st)\"/>\n  <text x=\"140\" y=\"262\" text-anchor=\"middle\" font-family=\"Consolas, monospace\" font-size=\"19\" fill=\"#f1e6cc\" >t = 0<\/text>\n  <text x=\"140\" y=\"288\" text-anchor=\"middle\" font-family=\"Consolas, monospace\" font-size=\"19\" fill=\"#ff9a3d\" >v₀ = 0<\/text>\n  <text x=\"140\" y=\"310\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#f1e6cc\" >(parte do repouso)<\/text>\n  <text x=\"470\" y=\"262\" text-anchor=\"middle\" font-family=\"Consolas, monospace\" font-size=\"19\" fill=\"#f1e6cc\" >t = 2 s<\/text>\n  <text x=\"470\" y=\"288\" text-anchor=\"middle\" font-family=\"Consolas, monospace\" font-size=\"19\" fill=\"#ff9a3d\" >v = 22 m/s<\/text>\n  <text x=\"340\" y=\"348\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"20\" fill=\"#ff9a3d\" font-weight=\"bold\">impulso médio recebido nesses 2 s: I = ?<\/text>\n<text id=\"credito\" x=\"672\" y=\"364\" text-anchor=\"end\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"12\" fill=\"#d8b46a\" opacity=\".85\">Prof. Bruno Bueno<\/text>\n<\/svg>\n"}, "perguntas": [{"pergunta": "Por que dá para achar o impulso sem conhecer a força que age no atleta?", "resposta": "Porque o impulso da resultante é igual à variação da quantidade de movimento, que depende só da massa e das velocidades."}, {"pergunta": "O que o impulso mede? Em que ele é diferente da força?", "resposta": "Mede o efeito da força acumulado durante o tempo em que ela age. A força é o valor em cada instante."}, {"pergunta": "Se o atleta chegasse à mesma velocidade em 4 s, em vez de 2 s, o impulso mudaria? E a força média?", "resposta": "O impulso seria o mesmo, pois a variação da quantidade de movimento é a mesma. A força média seria menor."}], "resolucao": "Pelo teorema do impulso: O impulso da força resultante $\\left( I_{Fr} \\right)$ é igual à variação da quantidade de movimento $(\\Delta Q)$ . Considerando o movimento retilíneo, podemos expressar o teorema na forma modular:\n\n$\\begin{aligned}I\\ _{\\overset{\\rightarrow}{F_{r}}} &= \\Delta Q \\\\ &= m\\ \\Delta v \\\\ &= 85 \\times 22 \\\\ &= 1870\\ N \\cdot s.\\end{aligned}$\n\n**Comentário:** Certamente, houve um engano da banca examinadora ao dar a unidade da velocidade (deveria ser km/h) atingida pelo atleta, pois nenhum atleta (humano) consegue atingir essa velocidade e nem esse impulso. O recordista mundial de velocidades, Usain Bolt, percorreu 100 m em 9,58 s, atingindo velocidade média de 10,44 m/s.\n\nA velocidade de 22 m/s corresponde a 79,2 km/h!", "gabarito": "D"}, {"id": "sp-151727", "refeitas": ["<svg viewBox=\"0 0 420 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfico da força F, em newtons, em função do tempo t, em segundos: cai de 120 N em t = 0 para 100 N em t = 5 s e fica em 100 N até t = 105 s; o eixo do tempo está interrompido entre 5 e 105\"><style id=\"estilo\">text{paint-order:stroke;stroke:#0b1a2e;stroke-width:3px;stroke-linejoin:round}[stroke=\"#ff9a3d\"],[fill=\"#ff9a3d\"]:not(text){filter:drop-shadow(0 0 4px rgba(255,154,61,.7))}<\/style>\n<rect width=\"420\" height=\"270\" fill=\"#0b1a2e\"/>\n<polyline points=\"60.0,102.0 109.1,102.0 109.1,226.0\" fill=\"none\" stroke=\"#d8b46a\" stroke-width=\"1.4\" stroke-dasharray=\"6 5\"/>\n<polyline points=\"305.3,102.0 305.3,226.0\" fill=\"none\" stroke=\"#d8b46a\" stroke-width=\"1.4\" stroke-dasharray=\"6 5\"/>\n<line x1=\"60.0\" y1=\"226.0\" x2=\"368.0\" y2=\"226.0\" stroke=\"#f1e6cc\" stroke-width=\"1.8\"/>\n<path d=\"M374.0 226.0l-11 -4.5v9z\" fill=\"#f1e6cc\"/>\n<line x1=\"60.0\" y1=\"226.0\" x2=\"60.0\" y2=\"46.0\" stroke=\"#f1e6cc\" stroke-width=\"1.8\"/>\n<path d=\"M60.0 40.0l-4.5 11h9z\" fill=\"#f1e6cc\"/>\n<text x=\"109.1\" y=\"248.0\" text-anchor=\"middle\" font-family=\"Consolas,monospace\" font-size=\"17\" fill=\"#f1e6cc\">5<\/text>\n<text x=\"305.3\" y=\"248.0\" text-anchor=\"middle\" font-family=\"Consolas,monospace\" font-size=\"17\" fill=\"#f1e6cc\">105<\/text>\n<text x=\"50.0\" y=\"83.2\" text-anchor=\"end\" font-family=\"Consolas,monospace\" font-size=\"17\" fill=\"#f1e6cc\">120<\/text>\n<text x=\"50.0\" y=\"108.0\" text-anchor=\"end\" font-family=\"Consolas,monospace\" font-size=\"17\" fill=\"#f1e6cc\">100<\/text>\n<text x=\"50.0\" y=\"248.0\" text-anchor=\"end\" font-family=\"Consolas,monospace\" font-size=\"17\" fill=\"#f1e6cc\">0<\/text>\n<text x=\"50.0\" y=\" f-pism 1/2020", "bloco": "", "enunciado": "(Ufjf-pism 1) A possibilidade de diminuir o módulo da força que atua sobre um objeto 0até ele parar, aumentando-se o tempo de atuação da força, tem muitas aplicações práticas como, por exemplo, o uso de “air-bags” em automóveis ou, nas competições de salto em altura, o uso de colchões para aparar a queda dos atletas. Um atleta cai sobre um colchão de ar, 1recebendo um impulso de $600\\ N\\cdot s.$ Qual é a 2força média $F$ que atua sobre esse atleta e qual é a variação da quantidade de movimento ΔQ do atleta, respectivamente, nas seguintes situações: (i) se ele para $0{,}5\\ s$ após o impacto inicial, e (ii) se ele para $0{,}1\\ s$ após o impacto inicial?", "alternativas": [{"letra": "A", "texto": "(i) $F=1200\\ N$ e $\\Delta Q=600\\ N\\cdot s;$ (ii) $F=6000\\ N$ e $\\Delta Q=3000\\ N\\cdot s.$"}, {"letra": "B", "texto": "(i) $F=300\\ N$ e $\\Delta Q=3000\\ N\\cdot s;$ (ii) $F=60\\ N$ e $\\Delta Q=600\\ N\\cdot s.$"}, {"letra": "C", "texto": "(i) $F=300\\ N$ e $\\Delta Q=600\\ N\\cdot s;$ (ii) $F=60\\ N$ e $\\Delta Q=600\\ N\\cdot s.$"}, {"letra": "D", "texto": "(i) $F=1200\\ N$ e $\\Delta Q=600\\ N\\cdot s;$ (ii) $F=6000\\ N$ e $\\Delta Q=600\\ N\\cdot s.$"}, {"letra": "E", "texto": "(i) $F=300\\ N$ e $\\Delta Q=600\\ N\\cdot s;$ (ii) $F=60\\ N$ e $\\Delta Q=120\\ N\\cdot s.$"}], "dados": [{"trecho": "até ele parar", "significado": "a velocidade final é nula nas duas situações", "no_texto": true, "pergunta": ""}, {"trecho": "recebendo um impulso", "significado": "pelo teorema do impulso, esse valor é a própria variação da quantidade de movimento do atleta", "no_texto": true, "pergunta": ""}, {"trecho": "força média", "significado": "valor constante que produziria o mesmo impulso no mesmo tempo", "no_texto": true, "pergunta": ""}], "visual": null, "perguntas": [{"pergunta": "Por que a variação da quantidade de movimento é a mesma com um colchão macio ou duro?", "resposta": "Porque ela depende só da velocidade com que o atleta chega e do fato de ele parar, não do tempo que leva para parar."}, {"pergunta": "N·s e kg·m/s são unidades diferentes?", "resposta": "Não. Como 1 N = 1 kg·m/s², as duas são a mesma unidade; por isso impulso e quantidade de movimento podem ser igualados."}, {"pergunta": "Se o atleta caísse direto no chão, o que mudaria: o impulso ou a força?", "resposta": "A força. O impulso seria o mesmo, mas o tempo de parada seria muito menor e a força média, muito maior."}], "resolucao": "Considerando o Teorema do Impulso, em que $I=\\Delta Q,$ a variação da quantidade de movimento será a mesma fornecida pelo enunciado, ou seja, $I=\\Delta Q=600\\ Ns.$\n\nJá a força média é inversamente proporcional ao tempo de ação da mesma de acordo com a expressão:\n\n$I=F_{ m } \\cdot \\Delta t\\therefore F_{ m } =\\frac { I } { \\Delta t }$\n\nPara a situação (i):\n\n$F_{ m } =\\frac { I } { \\Delta t }=\\frac { 600\\ Ns } { 0{,}5\\ s }$\n$\\therefore  F_{ m } =1200\\ N$\n\nPara a situação (ii):\n\n$F_{ m } =\\frac { I } { \\Delta t }=\\frac { 600\\ Ns } { 0{,}1\\ s }$\n$\\therefore  F_{ m } =6000\\ N$", "gabarito": "D"}, {"id": "sp-166913", "refeitas": ["<svg viewBox=\"0 0 420 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfico da força F, em newtons, em função do tempo t, em segundos: sobe de 10 N em t = 0 a 20 N em t = 1 s, fica em 20 N até t = 3 s e cai a zero em t = 4 s\"><style id=\"estilo\">text{paint-order:stroke;stroke:#0b1a2e;stroke-width:3px;stroke-linejoin:round}[stroke=\"#ff9a3d\"],[fill=\"#ff9a3d\"]:not(text){filter:drop-shadow(0 0 4px rgba(255,154,61,.7))}<\/style>\n<rect width=\"420\" height=\"270\" fill=\"#0b1a2e\"/>\n<polyline points=\"50.0,93.1 118.9,93.1\" fill=\"none\" stroke=\"#d8b46a\" stroke-width=\"1.4\" stroke-dasharray=\"6 5\"/>\n<polyline points=\"118.9,226.0 118.9,93.1\" fill=\"none\" stroke=\"#d8b46a\" stroke-width=\"1.4\" stroke-dasharray=\"6 5\"/>\n<polyline points=\"187.9,226.0 187.9,93.1\" fill=\"none\" stroke=\"#d8b46a\" ,rod=false,val=false,TOL=0.004,alvo=null,espera=0,PAUSA=0.9,VIAGEM=0.7,u0=0,tv=0;\n var P=o.pontos,ciclo=!!o.ciclo;\n /* linha do tempo: um marco por ponto de parada e um cursor que acompanha a cena */\n var lt=$('lt');P.forEach(function(x,i){var b=document.createElement('button');b.className='mk';b.style.left=(x.u*100)+'%';b.setAttribute('aria-label',x.nome);\n  b.onclick=function(){ir(x.u);};lt.appendChild(b);x._b=b;});\n function ponto(){var p=null;P.forEach(function(x){if(Math.abs(u-x.u)<TOL)p=x;});return (rod&&!espera)||alvo!==null?null:p;}\n function d(){var p=ponto();o.desenhar(u,val,p);$('pt').textContent=p?p.nome:'';$('cur').style.left=(u*100)+'%';\n  P.forEach(function(x){x._b.className='mk'+(p===x?' on':(x.u<u+TOL?' ja':''));});\n  $('ico').setAttribute('d',rod?'M7 5h4v14H7zM13 5h4v14h-4z':'M8 5v14l11-7z');$('bi').setAttribute('aria-label',rod?'Pausar':'Iniciar');}\n function parar(){cancelAnimationFrame(raf);rod=false;alvo=null;espera=0;}\n /* play: o movimento segue no ritmo fisico e faz uma pausa curta em cada ponto de parada do meio do caminho */\n function passo(t){if(t0===null)t0=t;var dt=Math.min((t-t0)/1000,0.05);t0=t;\n  if(espera>0){espera-=dt;if(espera<=0){espera=0;d();}raf=requestAnimationFrame(passo);return;}\n  var un=Math.min(u+dt/o.dur,1),pp=P.filter(function(x){return x.u>u+1e-9&&x.u<=un+1e-9&&x.u<1-TOL;})[0];\n  if(pp){u=pp.u;espera=PAUSA;rod=false;d();rod=true;$('ico').setAttribute('d','M7 5h4v14H7zM13 5h4v14h-4z');raf=requestAnimationFrame(passo);return;}\n  u=un;if(u>=1){rod=false;d();return;}d();raf=requestAnimationFrame(passo);}\n /* setas e marcos: a cena viaja ate o ponto, em vez de saltar */\n function viagem(t){if(t0===null)t0=t;tv+=Math.min((t-t0)/1000,0.05);t0=t;var k=Math.min(tv/VIAGEM,1);u=u0+(alvo-u0)*k;\n  if(k>=1){u=alvo;alvo=null;d();return;}d();raf=requestAnimationFrame(viagem);}\n function ir(x){parar();if(Math.abs(x-u)<TOL){d();return;}if(x<u&&!o.voltaSuave){u=x;d();return;}\n  alvo=x;u0=u;tv=0;t0=null;raf=requestAnim
